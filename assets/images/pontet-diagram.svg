<svg xmlns="http://www.w3.org/2000/svg" width="480" height="344" viewBox="0 0 480 344" role="img" aria-labelledby="title desc">
  <title id="title">Pontet file transfer</title>
  <desc id="desc">Drop files into a shared NAS folder. A Raspberry Pi Zero W running Pontet reads that folder over Wi-Fi using SMB and presents the synced files as USB storage to the 3D printer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#2457c5"/>
    </marker>
  </defs>
  <rect width="480" height="344" rx="12" fill="#eaf0f7"/>
  <g fill="#fff" stroke="#d6dfea">
    <rect x="24" y="20" width="432" height="68" rx="8"/>
    <rect x="24" y="138" width="432" height="68" rx="8"/>
    <rect x="24" y="256" width="432" height="68" rx="8"/>
  </g>
  <g fill="none" stroke="#2457c5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shared NAS folder -->
    <path d="M43 67V39h13l5 6h16v22Z"/>
    <path d="M43 49h34"/>
    <!-- Raspberry Pi board -->
    <rect x="43" y="155" width="34" height="34" rx="4"/>
    <rect x="53" y="165" width="14" height="14" rx="2"/>
    <path d="M49 151v4m11-4v4m11-4v4M49 189v4m11-4v4m11-4v4"/>
    <!-- 3D printer -->
    <path d="M43 305v-31h34v31m-38 0h42M43 284h34m-17-10v10m-4 0 4 5 4-5m-12 16h16l-3-6h-10Z"/>
    <path d="M60 96v32M60 214v32" marker-end="url(#arrow)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#172b44">
    <g font-size="19" font-weight="600">
      <text x="100" y="49">Shared NAS folder</text>
      <text x="100" y="167">Raspberry Pi Zero W</text>
      <text x="100" y="285">3D printer</text>
    </g>
    <g font-size="14" fill="#52647b">
      <text x="100" y="71">Drop a print file here</text>
      <text x="100" y="189">Pontet syncs files to a USB disk image</text>
      <text x="100" y="307">Reads the Pi as USB storage</text>
    </g>
    <g font-size="15" fill="#2457c5" font-weight="500">
      <text x="100" y="118">Wi-Fi / SMB share</text>
      <text x="100" y="236">USB cable / mass storage</text>
    </g>
  </g>
</svg>
