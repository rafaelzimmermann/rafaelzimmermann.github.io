<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max's Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a1a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        canvas#stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            cursor: crosshair;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px;
        }

        .title {
            font-size: clamp(80px, 20vw, 180px);
            font-weight: 900;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #c77dff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite, bounce 2s ease-in-out infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(255,180,0,0.4));
            line-height: 1;
            margin-bottom: 10px;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-12px); }
        }

        .subtitle {
            font-size: clamp(18px, 4vw, 28px);
            color: #aad4ff;
            margin-bottom: 50px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            animation: fadeIn 1s ease 0.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hint {
            font-size: 14px;
            color: #556;
            margin-top: 30px;
            letter-spacing: 0.1em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50%       { opacity: 1; }
        }

        .score-board {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px 40px;
            text-align: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease 0.8s both;
        }

        .score-label {
            font-size: 13px;
            color: #778;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 52px;
            font-weight: 900;
            color: #ffd93d;
            line-height: 1;
            transition: transform 0.1s ease;
        }

        .score-value.pop {
            transform: scale(1.4);
        }

        .rocket-btn {
            margin-top: 30px;
            padding: 16px 40px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            color: #1a0a00;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 20px rgba(255,180,0,0.4);
            animation: fadeIn 1s ease 1s both;
            letter-spacing: 0.05em;
        }

        .rocket-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 30px rgba(255,180,0,0.6);
        }

        .rocket-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="content">
    <div class="title">ARTHUR</div>
    <div class="subtitle">Commander of the Universe</div>

    <div class="score-board">
        <div class="score-label">Stars Launched</div>
        <div class="score-value" id="score">0</div>
    </div>

    <button class="rocket-btn" id="bigBtn">Launch Rocket!</button>

    <p class="hint">Click anywhere on the sky to shoot stars</p>
</div>

<script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let scoreEl = document.getElementById('score');
    let score = 0;
    let particles = [];
    let backgroundStars = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Generate background stars
    for (let i = 0; i < 200; i++) {
        backgroundStars.push({
            x: Math.random(),
            y: Math.random(),
            r: Math.random() * 1.5 + 0.3,
            twinkle: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.02 + 0.005
        });
    }

    const COLORS = [
        '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff',
        '#c77dff', '#ff9f43', '#00d4ff', '#ff6eb4'
    ];

    function addScore(n) {
        score += n;
        scoreEl.textContent = score;
        scoreEl.classList.remove('pop');
        void scoreEl.offsetWidth;
        scoreEl.classList.add('pop');
        setTimeout(() => scoreEl.classList.remove('pop'), 150);
    }

    function burst(x, y, count) {
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
            const speed = Math.random() * 6 + 2;
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                r: Math.random() * 4 + 2,
                color,
                alpha: 1,
                decay: Math.random() * 0.015 + 0.012,
                trail: []
            });
        }
    }

    function rocketBurst() {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        for (let wave = 0; wave < 3; wave++) {
            setTimeout(() => {
                const ox = cx + (Math.random() - 0.5) * 100;
                const oy = cy + (Math.random() - 0.5) * 100;
                burst(ox, oy, 40);
                addScore(10);
            }, wave * 150);
        }
    }

    canvas.addEventListener('click', (e) => {
        burst(e.clientX, e.clientY, 20);
        addScore(1);
    });

    document.getElementById('bigBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        rocketBurst();
    });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background stars
        const t = Date.now() * 0.001;
        backgroundStars.forEach(s => {
            s.twinkle += s.speed;
            const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle));
            ctx.beginPath();
            ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
            ctx.fill();
        });

        // Particles
        particles = particles.filter(p => p.alpha > 0);
        particles.forEach(p => {
            p.trail.push({ x: p.x, y: p.y, alpha: p.alpha });
            if (p.trail.length > 8) p.trail.shift();

            p.trail.forEach((pt, i) => {
                const a = pt.alpha * (i / p.trail.length) * 0.4;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, p.r * (i / p.trail.length), 0, Math.PI * 2);
                ctx.fillStyle = p.color + Math.floor(a * 255).toString(16).padStart(2, '0');
                ctx.fill();
            });

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.fill();
            ctx.globalAlpha = 1;

            // Glow
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 2, 0, Math.PI * 2);
            const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2);
            grd.addColorStop(0, p.color + '88');
            grd.addColorStop(1, p.color + '00');
            ctx.fillStyle = grd;
            ctx.fill();

            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.08; // gravity
            p.vx *= 0.99;
            p.alpha -= p.decay;
        });

        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
